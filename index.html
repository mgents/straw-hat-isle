<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Straw Hat Isle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#63c7de">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #63c7de;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #unity-canvas {
      width: 100%; height: 100%; display: block;
      background: #63c7de;
      touch-action: none;          /* no Safari pan or pinch on top of the game */
      outline: none;
    }
    #loading {
      position: fixed; inset: 0; z-index: 5;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; padding: 24px;
      background: radial-gradient(120% 90% at 50% 20%, #a8e4f2 0%, #63c7de 55%, #3fa8c4 100%);
      color: #48372a; text-align: center;
      transition: opacity .45s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading h1 {
      margin: 0; font-size: clamp(28px, 6vw, 54px); letter-spacing: .02em;
      color: #fff6e2; text-shadow: 0 3px 0 rgba(72,55,42,.35);
    }
    #loading p { margin: 0; font-size: clamp(14px, 2.6vw, 19px); color: #3c4f52; }
    #bar {
      width: min(360px, 74vw); height: 16px; border-radius: 99px;
      background: rgba(255,246,226,.42); overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(72,55,42,.2);
    }
    #fill { height: 100%; width: 0%; border-radius: 99px; background: #f6c453; transition: width .2s ease; }
    #hat { font-size: clamp(46px, 11vw, 86px); line-height: 1; }
    #err {
      position: fixed; inset: auto 16px 16px 16px; z-index: 9;
      background: #fff6e2; color: #48372a; border-radius: 14px;
      padding: 14px 16px; font-size: 15px; display: none;
      box-shadow: 0 6px 24px rgba(0,0,0,.25);
    }
    @media (prefers-reduced-motion: reduce) {
      #loading, #fill { transition: none; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="loading">
    <div id="hat">👒</div>
    <h1>Straw Hat Isle</h1>
    <div id="bar"><div id="fill"></div></div>
    <p id="tip">Loading the island…</p>
  </div>

  <div id="err"></div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#loading");
    var fill = document.querySelector("#fill");
    var tip = document.querySelector("#tip");
    var err = document.querySelector("#err");

    // Safari likes to zoom on a double tap; the game handles its own taps.
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener("touchmove", function (e) {
      if (e.target === canvas) e.preventDefault();
    }, { passive: false });

    var config = {
      dataUrl: "Build/WebGL.data.unityweb?v=20260908-1151",
      frameworkUrl: "Build/WebGL.framework.js.unityweb?v=20260908-1151",
      codeUrl: "Build/WebGL.wasm.unityweb?v=20260908-1151",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Leo",
      productName: "Straw Hat Isle",
      productVersion: "20260908-1151",
      matchWebGLToCanvasSize: true
    };

    // iPads have a lot of pixels and not a lot of patience; cap the ratio.
    config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

    function showError(msg) {
      err.style.display = "block";
      err.textContent = msg;
    }

    var script = document.createElement("script");
    script.src = "Build/WebGL.loader.js?v=20260908-1151";
    script.onerror = function () { showError("Could not load the game files. Try refreshing the page."); };
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        var pct = Math.round(progress * 100);
        fill.style.width = pct + "%";
        if (pct > 55) tip.textContent = "Waking up the crew…";
        if (pct > 88) tip.textContent = "Almost there…";
      }).then(function (instance) {
        window.unityInstance = instance;
        loading.classList.add("done");
        setTimeout(function () { loading.style.display = "none"; }, 500);
        canvas.focus();
      }).catch(function (message) {
        showError(String(message));
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
